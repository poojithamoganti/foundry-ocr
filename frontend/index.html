<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>foundry_ocr</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f3f6;
    --surface: #ffffff;
    --surface-2: #f7f8fa;
    --ink: #191c20;
    --ink-muted: #5b6270;
    --ink-faint: #8a91a0;
    --line: #e3e5e9;
    --accent: #3457d5;
    --accent-ink: #2540a8;
    --accent-wash: #eaeefc;
    --warn: #9a6b12;
    --warn-bg: #fdf3dd;
    --warn-line: #f0d99a;
    --shadow: 0 1px 2px rgba(20,22,30,.04), 0 6px 20px -8px rgba(20,22,30,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1c1f24;
      --surface-2: #20242a;
      --ink: #e8eaed;
      --ink-muted: #9aa3ae;
      --ink-faint: #6b7480;
      --line: #2a2e35;
      --accent: #6d8bff;
      --accent-ink: #a9bbff;
      --accent-wash: #1c2340;
      --warn: #e8c468;
      --warn-bg: #2c2612;
      --warn-line: #4a3f1c;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px -8px rgba(0,0,0,.5);
    }
  }

  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  .shell { max-width: 1180px; margin: 0 auto; padding: 28px 24px 56px; }

  .app-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-bottom: 20px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--line);
  }
  .brand-mark {
    width: 38px; height: 38px;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: .02em;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .app-header h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .app-header .tagline { font-size: 13px; color: var(--ink-muted); margin: 2px 0 0; }

  .upload-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 20px 22px;
    display: flex;
    align-items: flex-end;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--ink-faint);
  }
  select, .file-picker button {
    font: inherit;
    font-size: 13.5px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    border-radius: 7px;
    padding: 8px 12px;
    min-height: 36px;
  }
  select { min-width: 190px; }
  select:focus-visible, .file-picker button:focus-visible, .btn-primary:focus-visible, .checkbox-field input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .file-picker { display: flex; align-items: center; gap: 10px; }
  .file-picker button { cursor: pointer; }
  .file-picker button:hover { border-color: var(--accent); color: var(--accent-ink); }
  .file-name { font-size: 13px; color: var(--ink-muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .checkbox-field {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    color: var(--ink-muted);
    padding-bottom: 8px;
  }
  .checkbox-field input { width: 16px; height: 16px; accent-color: var(--accent); }

  .btn-primary {
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 9px 20px;
    cursor: pointer;
    min-height: 36px;
  }
  .btn-primary:hover { background: var(--accent-ink); }
  .btn-primary:disabled { opacity: .5; cursor: default; background: var(--accent); }

  .status { font-size: 13px; color: var(--ink-muted); padding-bottom: 8px; }

  .warning {
    background: var(--warn-bg);
    border: 1px solid var(--warn-line);
    color: var(--warn);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    margin-bottom: 16px;
  }

  .empty-state {
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 48px 24px;
    text-align: center;
    color: var(--ink-faint);
    font-size: 13.5px;
  }

  .model-input {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 14px 18px;
    margin-top: 20px;
  }
  .model-input summary {
    cursor: pointer;
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink-faint);
  }
  .model-input pre {
    margin: 14px 0 0;
    padding: 12px 14px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 420px;
    overflow-y: auto;
  }

  .layout { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }

  .pages { display: flex; flex-direction: column; gap: 16px; }
  .page { position: relative; display: inline-block; max-width: 100%; background: var(--surface); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); }
  .page img { display: block; max-width: 100%; height: auto; }
  .bbox { position: absolute; border: 2px solid; box-sizing: border-box; pointer-events: none; opacity: .55; border-radius: 2px; }
  .bbox.active { opacity: 1; border-width: 3px; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 16px;
    position: sticky;
    top: 20px;
  }
  .panel h2 {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink-faint);
    margin: 0 0 12px;
  }
  .entity {
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 4px;
    border: 1px solid transparent;
  }
  .entity:hover, .entity.active { background: var(--accent-wash); border-color: var(--line); }
  .entity .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 7px; }
  .entity .field { font-weight: 600; font-size: 12.5px; letter-spacing: .01em; }
  .entity .value { font-size: 13.5px; color: var(--ink); word-break: break-word; margin-top: 2px; display: block; }
  .entity .no-bbox { font-size: 11.5px; color: var(--ink-faint); margin-top: 3px; }
</style>
</head>
<body>
<div class="shell">

  <header class="app-header">
    <span class="brand-mark">FO</span>
    <div>
      <h1>foundry_ocr</h1>
      <p class="tagline">Upload a PDF or image to extract structured fields with grounded bounding boxes.</p>
    </div>
  </header>

  <section class="upload-card">
    <div class="field">
      <label for="docType">Document type</label>
      <select id="docType"><option value="">Loading…</option></select>
    </div>
    <div class="field">
      <label for="ocrEngine">OCR engine</label>
      <select id="ocrEngine">
        <option value="paddle_ocr">Paddle OCR</option>
        <option value="document_intelligence_layout">Document Intelligence Layout</option>
      </select>
    </div>
    <div class="field">
      <label>Document</label>
      <div class="file-picker">
        <input type="file" id="fileInput" accept="application/pdf,image/*" hidden>
        <button type="button" id="filePickerBtn">Choose file</button>
        <span class="file-name" id="fileName">No file chosen</span>
      </div>
    </div>
    <label class="checkbox-field"><input type="checkbox" id="forceOcr"> Force OCR (ignore embedded text layer)</label>
    <button id="submitBtn" class="btn-primary">Extract</button>
    <span class="status" id="status"></span>
  </section>

  <div id="warning"></div>

  <div class="empty-state" id="emptyState">Upload a document above to see extracted entities and bounding boxes here.</div>

  <div class="layout" id="results" style="display:none">
    <div class="pages" id="pages"></div>
    <div class="panel">
      <h2>Extracted entities</h2>
      <div id="entities"></div>
    </div>
  </div>

  <details class="model-input" id="modelInput" style="display:none">
    <summary>Model input — reconstructed text, reading order</summary>
    <pre id="modelInputText"></pre>
  </details>

</div>

<script>
const PALETTE = ["#e6194b", "#3cb44b", "#4363d8", "#f58231", "#911eb4", "#46f0f0", "#f032e6", "#bcf60c", "#008080"];

const docType = document.getElementById("docType");
const fileInput = document.getElementById("fileInput");
const ocrEngine = document.getElementById("ocrEngine");
const filePickerBtn = document.getElementById("filePickerBtn");
const fileNameEl = document.getElementById("fileName");
const forceOcr = document.getElementById("forceOcr");
const submitBtn = document.getElementById("submitBtn");
const statusEl = document.getElementById("status");
const warningEl = document.getElementById("warning");
const emptyStateEl = document.getElementById("emptyState");
const resultsEl = document.getElementById("results");
const pagesEl = document.getElementById("pages");
const entitiesEl = document.getElementById("entities");
const modelInputEl = document.getElementById("modelInput");
const modelInputTextEl = document.getElementById("modelInputText");

(async function loadDocTypes() {
  try {
    const resp = await fetch("/api/doc-types");
    const data = await resp.json();
    docType.innerHTML = data.doc_types.length
      ? data.doc_types.map(t => `<option value="${t}">${t.replace(/_/g, " ")}</option>`).join("")
      : '<option value="">No document types configured</option>';
  } catch (err) {
    docType.innerHTML = '<option value="">Failed to load document types</option>';
  }
})();

filePickerBtn.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => {
  fileNameEl.textContent = fileInput.files[0] ? fileInput.files[0].name : "No file chosen";
});

submitBtn.addEventListener("click", async () => {
  const file = fileInput.files[0];
  if (!file) { statusEl.textContent = "Choose a file first."; return; }
  if (!docType.value) { statusEl.textContent = "Choose a document type first."; return; }

  submitBtn.disabled = true;
  statusEl.textContent = "Processing — this can take up to a minute (OCR + agent reasoning)...";
  warningEl.innerHTML = "";
  resultsEl.style.display = "none";

  const formData = new FormData();
  formData.append("file", file);
  formData.append("doc_type", docType.value);
  formData.append("force_ocr", forceOcr.checked);
  formData.append("ocr_engine", ocrEngine.value);

  try {
    const resp = await fetch("/api/extract", { method: "POST", body: formData });
    if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
    const data = await resp.json();
    render(data);
    statusEl.textContent = `Done — source: ${data.ocr_source}.`;
  } catch (err) {
    statusEl.textContent = `Error: ${err.message}`;
  } finally {
    submitBtn.disabled = false;
  }
});

function render(data) {
  emptyStateEl.style.display = "none";
  modelInputEl.style.display = "block";
  modelInputTextEl.textContent = data.document_text;

  if (!data.guardrail_allowed) {
    warningEl.innerHTML = '<div class="warning">Content Safety guardrail flagged the extracted entities — result withheld from normal processing, shown here for review only.</div>';
  }

  pagesEl.innerHTML = "";
  entitiesEl.innerHTML = "";

  const fieldColor = {};
  Object.keys(data.entities).forEach((field, i) => { fieldColor[field] = PALETTE[i % PALETTE.length]; });

  data.pages.forEach(page => {
    const pageDiv = document.createElement("div");
    pageDiv.className = "page";
    pageDiv.dataset.page = page.page;

    const img = document.createElement("img");
    img.src = `data:image/png;base64,${page.image_base64}`;
    pageDiv.appendChild(img);

    for (const [field, occurrences] of Object.entries(data.entities)) {
      occurrences.forEach((occ, idx) => {
        const key = `${field}::${idx}`;
        for (const box of (occ.bounding_boxes || [])) {
          if (box.page !== page.page || !box.bbox) continue;
          const [x0, y0, x1, y1] = box.bbox;
          const bboxDiv = document.createElement("div");
          bboxDiv.className = "bbox";
          bboxDiv.dataset.key = key;
          bboxDiv.style.borderColor = fieldColor[field];
          bboxDiv.style.left = `${x0 * 100}%`;
          bboxDiv.style.top = `${y0 * 100}%`;
          bboxDiv.style.width = `${(x1 - x0) * 100}%`;
          bboxDiv.style.height = `${(y1 - y0) * 100}%`;
          pageDiv.appendChild(bboxDiv);
        }
      });
    }
    pagesEl.appendChild(pageDiv);
  });

  for (const [field, occurrences] of Object.entries(data.entities)) {
    occurrences.forEach((occ, idx) => {
      const key = `${field}::${idx}`;
      const row = document.createElement("div");
      row.className = "entity";
      row.dataset.key = key;
      const hasBox = (occ.bounding_boxes || []).length > 0;
      const label = occurrences.length > 1 ? `${field} #${idx + 1}` : field;
      row.innerHTML = `
        <span class="swatch" style="background:${fieldColor[field]}"></span>
        <span class="field">${label}</span>
        <span class="value">${occ.value ?? ""}</span>
        ${hasBox ? "" : '<div class="no-bbox">no bounding box (not grounded in a span)</div>'}
      `;
      row.addEventListener("mouseenter", () => setActive(key, true));
      row.addEventListener("mouseleave", () => setActive(key, false));
      entitiesEl.appendChild(row);
    });
  }

  resultsEl.style.display = "grid";
}

function setActive(key, on) {
  document.querySelectorAll(`.bbox[data-key="${CSS.escape(key)}"]`).forEach(el => el.classList.toggle("active", on));
  document.querySelectorAll(`.entity[data-key="${CSS.escape(key)}"]`).forEach(el => el.classList.toggle("active", on));
}
</script>
</body>
</html>
